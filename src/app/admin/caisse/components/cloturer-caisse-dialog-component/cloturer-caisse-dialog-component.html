<div class="dlg">
  <div class="dlg-head">
    <div class="left">
      <div class="dlg-icon warn"><mat-icon>lock</mat-icon></div>
      <div>
        <h2>Clôture de caisse</h2>
        <p>Vérifie les soldes avant fermeture.</p>
      </div>
    </div>
    <button mat-icon-button (click)="close()"><mat-icon>close</mat-icon></button>
  </div>

  <div class="recap" *ngIf="session">
    <div class="box">
      <div class="k">Solde USD</div>
      <div class="v">{{ session.soldeActuelUSD | number:'1.2-2' }}</div>
    </div>
    <div class="box">
      <div class="k">Solde CDF</div>
      <div class="v">{{ session.soldeActuelCDF | number:'1.0-0' }}</div>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="dlg-body">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Note</mat-label>
      <textarea matInput rows="3" formControlName="note"></textarea>
    </mat-form-field>

    <div class="dlg-actions">
      <button mat-button type="button" (click)="close()">Annuler</button>
      <button mat-raised-button color="warn" type="submit">
        <mat-icon>done</mat-icon> Clôturer
      </button>
    </div>
  </form>
</div>
