

<div class="bordereau-detail" *ngIf="bordereau as b">
  <mat-card class="hero-card">
    <div class="hero-header">
      <div>
        <div class="breadcrumb">Inventaire / Bordereau / {{ b.reference }}</div>
        <h1>{{ b.reference }}</h1>
        <p>Saisie du comptage physique et traitement du bordereau.</p>
      </div>

      <div class="hero-actions">
        <button mat-stroked-button (click)="printBordereauPdf()">
  <mat-icon>picture_as_pdf</mat-icon>
    Imprimer PDF
  </button>

  <button
  mat-stroked-button
  color="primary"
  (click)="saveComptage()"
  [disabled]="submitting() || !canEdit()">
  Enregistrer
</button>

<button
  mat-flat-button
  color="primary"
  (click)="validerBordereau()"
  [disabled]="submitting() || !canValidate()">
  Valider bordereau
</button>

<button
  mat-flat-button
  color="warn"
  (click)="lancerVariances()"
  [disabled]="submitting() || !canLancerVariances()">
  Lancer variances
</button>

<button
  mat-flat-button
  color="accent"
  (click)="miseAJourStock()"
  [disabled]="submitting() || !canUpdateStock()">
  Mise à jour stock
</button>


        <!-- <button
          mat-stroked-button
          color="primary"
          (click)="saveComptage()"
          [disabled]="submitting() || !canEdit()">
          Enregistrer
        </button>
        <button
          mat-flat-button
          color="primary"
          (click)="validerBordereau()"
          [disabled]="submitting() || !canEdit()">
          Valider bordereau
        </button> -->

      </div>
    </div>

    <div class="hero-grid">
      <div class="meta-box">
        <span>Référence</span>
        <strong>{{ b.reference }}</strong>
      </div>

      <div class="meta-box">
        <span>N°</span>
        <strong>{{ b.numeroOrdre }}</strong>
      </div>

      <div class="meta-box">
        <span>Locator</span>
        <strong>{{ b.locatorCode || 'Tous' }}</strong>
      </div>

      <div class="meta-box">
        <span>Statut</span>
        <strong>{{ b.statut }}</strong>
      </div>

      <div class="meta-box">
        <span>Lignes</span>
        <strong>{{ totalLignes() }}</strong>
      </div>

      <div class="meta-box">
        <span>Saisies</span>
        <strong>{{ totalSaisies() }}</strong>
      </div>
    </div>
  </mat-card>



 <mat-card class="print-card count-sheet-card">
  <app-inventaire-card-print
    [inventaire]="{
      id: 0,
      reference: b.inventaireReference || '',
      type: 'GLOBAL',
      statut: b.statut,
      depotId: null,
      depotNom: lignesEditables[0]?.depotNom || null,
      locatorId: null,
      locatorCode: b.locatorCode || null,
      dateInventaire: b.dateCreation || null,
      dateOuverture: null,
      dateValidation: null,
      dateCloture: null,
      memorise: true,
      gelStockTheorique: true,
      varianceLancee: false,
      valide: false,
      cloture: false,
      bordereauxGeneres: true,
      commentaire: null
    }"
    [bordereau]="b"
    [lignes]="lignesEditables"
    [editable]="canEdit()">
  </app-inventaire-card-print>
</mat-card>
</div>
