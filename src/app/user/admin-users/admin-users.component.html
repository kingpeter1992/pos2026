<div class="page">
  <div class="header">
    <div>
      <h2>Gestion des utilisateurs</h2>
      <p class="muted">Bloquer / débloquer et gérer les rôles</p>
    </div>

    <button mat-stroked-button (click)="loadUsers()">
      <mat-icon>refresh</mat-icon>
      Rafraîchir
    </button>
  </div>

  <mat-card class="card">
    <div class="table-wrap">
      <table mat-table [dataSource]="users" class="mat-elevation-z0">

        <!-- Username -->
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
          <td mat-cell *matCellDef="let user">
            <div class="u">
              <div class="u-name">{{ user.username }}</div>
              <div class="u-email">{{ user.email }}</div>
            </div>
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Statut</th>
          <td mat-cell *matCellDef="let user">
            <span class="status" [class.blocked]="!user.active">
              <mat-icon class="status-ico">{{ user.active ? 'check_circle' : 'block' }}</mat-icon>
              {{ user.active ? 'Actif' : 'Bloqué' }}
            </span>
          </td>
        </ng-container>

        <!-- Roles -->
        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Rôles</th>
          <td mat-cell *matCellDef="let user">
            <div class="roles-grid">
           <mat-checkbox
  *ngFor="let role of rolesList"
  [checked]="user.selectedRoles.includes(role)"
  (change)="onRoleChange(user, role, $event.checked)">
  {{ role }}
</mat-checkbox>
            </div>

            <mat-chip-listbox class="chips" *ngIf="user.selectedRoles?.length">
              <mat-chip *ngFor="let r of user.selectedRoles" [disabled]="true">{{ r }}</mat-chip>
            </mat-chip-listbox>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let user">
            <div class="actions">
              <button
                mat-raised-button
                [color]="user.active ? 'warn' : 'primary'"
                (click)="toggleBlock(user)"
                [disabled]="loadingRow[user.id]">
                <mat-progress-spinner
                  *ngIf="loadingRow[user.id]"
                  diameter="18"
                  mode="indeterminate"
                  class="btn-spinner">
                </mat-progress-spinner>
                <mat-icon *ngIf="!loadingRow[user.id]">
                  {{ user.active ? 'lock' : 'lock_open' }}
                </mat-icon>
                {{ user.active ? 'Bloquer' : 'Débloquer' }}
              </button>

              <button
                mat-stroked-button
                color="primary"
                (click)="saveRoles(user)"
                [disabled]="savingRolesRow[user.id] || !isRolesDirty(user)">
                <mat-progress-spinner
                  *ngIf="savingRolesRow[user.id]"
                  diameter="18"
                  mode="indeterminate"
                  class="btn-spinner">
                </mat-progress-spinner>
                <mat-icon *ngIf="!savingRolesRow[user.id]">save</mat-icon>
                Sauvegarder
              </button>

              <div class="hint" *ngIf="isRolesDirty(user)">
                <mat-icon>info</mat-icon> Modifications non enregistrées
              </div>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['username','status','roles','actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['username','status','roles','actions'];"></tr>
      </table>
    </div>
  </mat-card>
</div>
